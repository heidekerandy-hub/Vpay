<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VPay</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- LOGIN / SIGNUP -->

    <div id="authScreen" class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                VPay
            </div>

            <h1 id="authTitle">
                Welcome to VPay
            </h1>

            <p id="authSubtitle">
                Manage your money smarter.
            </p>

            <div id="nameField" class="input-group hidden">

                <label>Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                >

            </div>

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

            </div>

            <button id="authButton" class="primary-btn">
                Login
            </button>

            <p id="authMessage" class="auth-message"></p>

            <p class="switch-auth">

                <span id="switchText">
                    Don't have an account?
                </span>

                <button id="switchAuth">
                    Create account
                </button>

            </p>

        </div>

    </div>


    <!-- DASHBOARD -->

    <div id="dashboard" class="hidden">

        <header class="topbar">

            <div class="logo">
                VPay
            </div>

            <button id="logoutButton" class="logout-btn">
                Logout
            </button>

        </header>

        <main class="container">

            <section class="welcome">

                <p>Welcome back</p>

                <h1 id="userName">
                    VPay User
                </h1>

            </section>

            <section class="balance-card">

                <p>Total Balance</p>

                <h2 id="totalBalance">
                    ₦0.00
                </h2>

                <div class="balance-actions">

                    <button id="addMoneyBtn">
                        ＋ Add Money
                    </button>

                    <button id="sendMoneyBtn">
                        ↗ Send Money
                    </button>

                </div>

            </section>

            <section class="quick-actions">

                <h2>
                    Quick Actions
                </h2>

                <div class="action-grid">

                    <button>
                        💰 Add Money
                    </button>

                    <button>
                        💸 Send Money
                    </button>

                    <button>
                        📊 Transactions
                    </button>

                    <button>
                        🎯 Savings Goal
                    </button>

                </div>

            </section>

            <section class="transactions">

                <div class="section-header">

                    <h2>
                        Recent Transactions
                    </h2>

                    <button>
                        View all
                    </button>

                </div>

                <div
                    id="transactionList"
                    class="empty-state"
                >

                    <div class="empty-icon">
                        💳
                    </div>

                    <h3>
                        No transactions yet
                    </h3>

                    <p>
                        Your recent VPay transactions
                        will appear here.
                    </p>

                </div>

            </section>

        </main>

        <footer>

            <p>
                © 2026 VPay
            </p>

        </footer>

    </div>


    <script src="app.js"></script>

</body>

</html>
